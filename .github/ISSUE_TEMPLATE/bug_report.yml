name: Bug report
description: Report a reproducible problem (report vulnerabilities privately).
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal example. Never include credentials or database files.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit or version, Node version, operating system, and browser.
    validations:
      required: true
