name: Feature proposal
description: Propose a user problem and a bounded solution.
body:
  - type: textarea
    id: need
    attributes:
      label: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
